name: ML Testing Pipeline

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CML (Continuous Machine Learning)
        uses: iterative/setup-cml@v2.0.1
        with:
          python-version: 3.8

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy joblib scikit-learn pytest gcsfs "dvc[gs]"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_KEY }}

      - name: Pull DVC artifacts
        run: dvc pull

      - name: Run pytest and save output
        run: pytest test_pipeline.py --maxfail=1 --disable-warnings -v > report.md

      - name: Post PR comment via CML
        run: cml comment create report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



